
name: Build Veyrox SFS Parts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type f

      - name: Build ZIP
        run: |
          mkdir -p output
          zip -r output/Veyrox-SFS-Parts.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "output/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veyrox-SFS-Parts
          path: output/Veyrox-SFS-Parts.zip
